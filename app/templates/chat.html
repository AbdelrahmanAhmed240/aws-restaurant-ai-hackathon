<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Break Restaurant — AI Ordering Assistant</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Markdown Parser & DOMPurify for secure, rich responses -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.2/dist/purify.min.js"></script>
    <style>
        :root {
            --brand-primary: #ffc107;
            --brand-dark: #212529;
            --brand-bg: #f8f9fa;
        }
        body {
            background-color: #f4f6f9;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .chat-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 0.25rem 1rem rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .chat-markdown {
            color: #212529;
            font-size: 0.95rem;
            line-height: 1.65;
            word-break: break-word;
            unicode-bidi: plaintext;
            text-align: start;
        }
        .chat-markdown h3 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-top: 0.4rem;
            margin-bottom: 0.75rem;
            color: #111827;
            border-bottom: 2px solid var(--brand-primary);
            padding-bottom: 0.35rem;
        }
        .chat-markdown h4 {
            font-size: 1.02rem;
            font-weight: 700;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            color: #1f2937;
            background-color: #f8f9fa;
            border-left: 3px solid var(--brand-primary);
            padding: 0.3rem 0.65rem;
            border-radius: 4px;
            display: inline-block;
        }
        .chat-markdown p {
            margin-top: 0.55rem;
            margin-bottom: 0.35rem;
        }
        .chat-markdown p:first-child {
            margin-top: 0;
        }
        .chat-markdown strong {
            font-weight: 700;
            color: #111827;
        }
        .chat-markdown ul, .chat-markdown ol {
            margin-top: 0.25rem;
            margin-bottom: 0.75rem;
            padding-inline-start: 1.45rem;
            list-style-type: disc;
        }
        .chat-markdown li {
            margin-bottom: 0.28rem;
            line-height: 1.55;
        }
        .chat-markdown blockquote {
            border-left: 4px solid var(--brand-primary);
            background: #fff9e6;
            padding: 0.5rem 0.85rem;
            margin: 0.6rem 0;
            border-radius: 4px;
            font-size: 0.92rem;
        }
        .quick-pill {
            cursor: pointer;
            transition: all 0.2s ease;
            background: #ffffff;
            border: 1px solid #dee2e6;
            color: #495057;
            font-size: 0.82rem;
            font-weight: 500;
            padding: 0.38rem 0.85rem;
            border-radius: 50rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.35;
            white-space: normal;
            word-break: normal;
            flex-shrink: 0;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
            text-decoration: none;
            user-select: none;
        }
        .quick-pill:hover {
            background-color: #fff9e6;
            border-color: #ffc107;
            color: #212529;
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(255, 193, 7, 0.25);
        }
        #quick-prompts-bar {
            flex-shrink: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0.6rem 1rem;
            background: #ffffff;
            border-top: 1px solid #e9ecef;
            align-items: center;
        }
        .chat-pane {
            min-height: 0;
            height: calc(100vh - 170px);
            max-height: calc(100vh - 170px);
            display: flex;
            flex-direction: column;
        }
        .chat-header, .chat-input-area {
            flex-shrink: 0;
        }
        #agent-messages {
            flex: 1 1 0;
            min-height: 0;
            overflow-y: auto;
            background: #fafafa;
        }
        .session-item {
            border-radius: 8px;
            margin: 2px 6px;
            transition: background-color 0.15s ease;
        }
        .session-item:hover {
            background-color: #f1f3f5;
        }
        .session-item.active {
            background-color: #ffc107 !important;
            color: #212529 !important;
            font-weight: 600;
        }
        .user-bubble {
            background: linear-gradient(135deg, #212529 0%, #343a40 100%);
            color: #ffffff;
            border-radius: 14px 14px 2px 14px;
            max-width: 85%;
        }
        .agent-bubble {
            background: #ffffff;
            border: 1px solid #e9ecef;
            border-radius: 14px 14px 14px 2px;
            max-width: 85%;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body>
    <!-- Customer Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-2">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-warning d-flex align-items-center" href="{{ url_for('admin.chat_view') }}">
                <i class="bi bi-fire text-warning fs-4 me-2"></i>
                <div>
                    <span class="fw-bold fs-5">Break Restaurant</span>
                    <span class="badge bg-warning text-dark ms-2 fw-semibold" style="font-size: 0.7rem;">AI Ordering</span>
                </div>
            </a>
            
            <div class="d-flex align-items-center gap-3">
                <span class="d-none d-md-inline-block text-white-50 small">
                    <i class="bi bi-circle-fill text-success me-1" style="font-size: 0.55rem;"></i>Open: Smouha • Camp Caesar • Glim • Sheraton
                </span>
                <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-light btn-sm rounded-pill px-3" title="Switch to Restaurant Operations View">
                    <i class="bi bi-speedometer2 me-1"></i>Admin Dashboard
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Chat Workspace -->
    <div class="container-fluid px-3 px-md-4 py-3 flex-grow-1 d-flex flex-column" style="max-width: 1400px;">
        <div class="card chat-card flex-grow-1 d-flex flex-column mb-3">
            <div class="card-body p-0 d-flex flex-column flex-grow-1">
                <div class="row g-0 flex-grow-1" style="min-height: calc(100vh - 170px);">
                    
                    <!-- Conversations Sidebar -->
                    <div class="col-md-4 col-lg-3 border-end bg-light d-flex flex-column" style="max-height: calc(100vh - 170px);">
                        <div class="p-3 border-bottom bg-white d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="mb-0 fw-bold text-dark"><i class="bi bi-chat-left-text me-2 text-warning"></i>Conversations</h6>
                                <span class="small text-muted"><span id="sessions-count">0</span> active sessions</span>
                            </div>
                            <button type="button" class="btn btn-warning btn-sm fw-semibold rounded-pill px-3" id="btn-new-chat">
                                <i class="bi bi-plus-lg me-1"></i>New
                            </button>
                        </div>
                        <div class="list-group list-group-flush flex-grow-1 overflow-auto p-2" id="sessions-list" style="max-height: calc(100vh - 240px);">
                            <!-- Loaded dynamically via JavaScript -->
                        </div>
                    </div>

                    <!-- Chat Stream & Input Area -->
                    <div class="col-md-8 col-lg-9 bg-white chat-pane">
                        <!-- Chat Session Header -->
                        <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-white shadow-sm chat-header">
                            <div class="d-flex align-items-center gap-2">
                                <div class="rounded-circle bg-warning bg-opacity-25 p-2 text-dark d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
                                    <i class="bi bi-robot text-dark fs-5"></i>
                                </div>
                                <div>
                                    <h6 class="mb-0 fw-bold" id="active-session-title">Chat 1</h6>
                                    <span class="small text-muted" id="active-session-id-display">Connecting...</span>
                                </div>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-3 py-1">
                                    <i class="bi bi-lightning-charge-fill me-1"></i>Strands Decider 2B
                                </span>
                            </div>
                        </div>

                        <!-- Messages Stream -->
                        <div id="agent-messages" class="p-4">
                            <div class="text-muted small text-center my-4">Select a conversation or start typing to ask about meals, orders, or branch locations.</div>
                        </div>

                        <!-- Quick Prompt Suggestions Bar -->
                        <div id="quick-prompts-bar">
                            <button type="button" class="quick-pill" data-prompt="What meals do you have on the menu?">
                                🍗 View Menu Meals
                            </button>
                            <button type="button" class="quick-pill" data-prompt="Recommend me a meal under 100 EGP">
                                💰 Budget Under 100 EGP
                            </button>
                            <button type="button" class="quick-pill" data-prompt="What branches can I pick up from?">
                                📍 Pickup Branches
                            </button>
                            <button type="button" class="quick-pill" data-prompt="I want to order a Break Meal combo for pickup">
                                🍔 Order Break Meal
                            </button>
                            <button type="button" class="quick-pill" data-prompt="Can I track my order?">
                                📦 Track Order
                            </button>
                        </div>

                        <!-- Chat Message Input Form -->
                        <div class="p-3 bg-white chat-input-area border-top">
                            <form id="agent-chat-form" class="d-flex gap-2">
                                <input type="text" id="agent-message" class="form-control form-control-lg fs-6" placeholder="Ask about menu, order a meal, or track an existing order..." required autocomplete="off">
                                <input type="hidden" id="agent-session-id" value="">
                                <button type="submit" class="btn btn-warning btn-lg fw-semibold px-4 fs-6" id="agent-send-btn">
                                    <i class="bi bi-send-fill me-1"></i>Send
                                </button>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    (function () {
        // 1. DOM Elements
        const form = document.getElementById('agent-chat-form');
        const input = document.getElementById('agent-message');
        const sessionInput = document.getElementById('agent-session-id');
        const messages = document.getElementById('agent-messages');
        const sendBtn = document.getElementById('agent-send-btn');
        const newChatBtn = document.getElementById('btn-new-chat');
        const sessionsList = document.getElementById('sessions-list');
        const sessionsCount = document.getElementById('sessions-count');
        const activeTitle = document.getElementById('active-session-title');
        const activeId = document.getElementById('active-session-id-display');
        const quickBar = document.getElementById('quick-prompts-bar');

        let currentSessionId = localStorage.getItem('rest_agent_current_session') || '';
        let busy = false;

        // 2. Fetch API Helper
        async function api(url, options = {}) {
            const response = await fetch(url, options);
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || 'Request failed');
            }
            return data;
        }

        // 3. Append Message to Chat Stream
        function appendMessage(role, text, html) {
            const wrapper = document.createElement('div');
            wrapper.className = role === 'user' ? 'mb-3 text-end' : 'mb-3 text-start';

            const label = document.createElement('div');
            label.className = 'small fw-semibold text-muted mb-1 px-1';
            label.textContent = role === 'user' ? 'You' : 'Break AI Assistant';

            const bubble = document.createElement('div');

            if (role === 'user') {
                bubble.className = 'p-3 user-bubble d-inline-block text-start shadow-sm';
                bubble.textContent = text;
                bubble.style.whiteSpace = 'pre-wrap';
                bubble.style.wordBreak = 'break-word';
            } else {
                bubble.className = 'p-3 agent-bubble chat-markdown d-inline-block text-start';
                if (html && window.DOMPurify) {
                    bubble.innerHTML = window.DOMPurify.sanitize(html);
                } else if (window.marked && window.DOMPurify) {
                    bubble.innerHTML = window.DOMPurify.sanitize(window.marked.parse(text));
                } else {
                    bubble.textContent = text;
                    bubble.style.whiteSpace = 'pre-wrap';
                }
            }

            wrapper.appendChild(label);
            wrapper.appendChild(bubble);
            messages.appendChild(wrapper);
            messages.scrollTop = messages.scrollHeight;
        }

        // 4. Load Conversation Messages
        async function loadMessages(sessionId) {
            if (!sessionId) return;
            messages.innerHTML = '<div class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm text-warning me-2"></div>Loading conversation...</div>';

            try {
                const data = await api('/agent/sessions/' + encodeURIComponent(sessionId) + '/messages');
                messages.innerHTML = '';

                if (!data.messages || data.messages.length === 0) {
                    messages.innerHTML = '<div class="text-muted small text-center my-4"><i class="bi bi-chat-heart text-warning fs-3 d-block mb-2"></i>Welcome! Ask about our meals, branches, or place an order.</div>';
                    return;
                }

                data.messages.forEach(function (message) {
                    appendMessage(message.role, message.content, message.html);
                });
            } catch (error) {
                messages.innerHTML = '<div class="alert alert-danger mx-auto my-3" style="max-width: 400px;">Failed to load conversation history.</div>';
            }
        }

        // 5. Select a Conversation
        function selectSession(sessionId, title) {
            currentSessionId = sessionId;
            sessionInput.value = sessionId;
            localStorage.setItem('rest_agent_current_session', sessionId);

            if (activeTitle) activeTitle.textContent = title || 'Chat';
            if (activeId) activeId.textContent = sessionId;

            document.querySelectorAll('.session-item').forEach(function (item) {
                const selected = item.dataset.id === sessionId;
                item.classList.toggle('active', selected);
            });

            loadMessages(sessionId);
        }

        // 6. Load Sessions List
        async function loadSessions(keepActive = true) {
            try {
                const sessions = await api('/agent/sessions');
                sessionsList.innerHTML = '';
                if (sessionsCount) sessionsCount.textContent = sessions.length;

                sessions.forEach(function (session) {
                    const item = document.createElement('div');
                    item.className = 'list-group-item border-0 py-2 px-3 small d-flex justify-content-between align-items-center session-item';
                    item.dataset.id = session.session_id;
                    item.style.cursor = 'pointer';

                    const title = document.createElement('span');
                    title.className = 'text-truncate flex-grow-1 me-2';
                    title.textContent = session.title || 'Chat';

                    const rightGroup = document.createElement('div');
                    rightGroup.className = 'd-flex align-items-center gap-1';

                    const count = document.createElement('span');
                    count.className = 'badge bg-secondary';
                    count.textContent = session.message_count || 0;

                    const delBtn = document.createElement('button');
                    delBtn.type = 'button';
                    delBtn.className = 'btn btn-link text-danger p-0 ms-1';
                    delBtn.title = 'Delete Chat';
                    delBtn.innerHTML = '<i class="bi bi-trash3"></i>';

                    delBtn.addEventListener('click', async function (ev) {
                        ev.stopPropagation();
                        if (!confirm('Are you sure you want to delete this chat?')) return;
                        delBtn.disabled = true;
                        try {
                            await api('/agent/sessions/' + encodeURIComponent(session.session_id), { method: 'DELETE' });
                            if (currentSessionId === session.session_id) currentSessionId = '';
                            await loadSessions(true);
                        } catch (err) {
                            alert('Failed to delete chat: ' + err.message);
                            delBtn.disabled = false;
                        }
                    });

                    rightGroup.appendChild(count);
                    rightGroup.appendChild(delBtn);

                    item.addEventListener('click', function () {
                        selectSession(session.session_id, session.title);
                    });

                    item.appendChild(title);
                    item.appendChild(rightGroup);
                    sessionsList.appendChild(item);
                });

                const saved = sessions.find(function (s) { return s.session_id === currentSessionId; });
                if (keepActive && saved) {
                    selectSession(saved.session_id, saved.title);
                } else if (sessions.length > 0) {
                    selectSession(sessions[0].session_id, sessions[0].title);
                } else {
                    // Automatically create first session if none exist
                    if (newChatBtn) newChatBtn.click();
                }
            } catch (error) {
                console.error('Failed to load chat sessions:', error);
            }
        }

        // 7. Create New Chat
        if (newChatBtn) {
            newChatBtn.addEventListener('click', async function () {
                newChatBtn.disabled = true;
                try {
                    const session = await api('/agent/sessions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({})
                    });
                    currentSessionId = session.session_id;
                    await loadSessions(true);
                } catch (error) {
                    alert('Failed to create new chat: ' + error.message);
                } finally {
                    newChatBtn.disabled = false;
                }
            });
        }

        // 8. Submit Chat Message
        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            if (busy) return;

            const message = input.value.trim();
            const sessionId = sessionInput.value;
            if (!message) return;

            if (!sessionId) {
                alert('Please select or create a chat session first.');
                return;
            }

            busy = true;
            input.disabled = true;
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Thinking...';

            appendMessage('user', message);
            input.value = '';

            const controller = new AbortController();
            const timeout = setTimeout(function () { controller.abort(); }, 120000);

            try {
                const data = await api('/agent/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, message: message }),
                    signal: controller.signal
                });

                if (data.error) {
                    appendMessage('agent', 'Error: ' + data.error);
                } else if (data.message) {
                    appendMessage('agent', data.message, data.html);
                } else {
                    appendMessage('agent', 'No response received.');
                }

                await loadSessions(true);
            } catch (error) {
                if (error.name === 'AbortError') {
                    appendMessage('agent', 'Request timed out. Please try again.');
                } else {
                    appendMessage('agent', 'Request error: ' + error.message);
                }
            } finally {
                clearTimeout(timeout);
                busy = false;
                input.disabled = false;
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i class="bi bi-send-fill me-1"></i>Send';
                input.focus();
                messages.scrollTop = messages.scrollHeight;
            }
        });

        // 9. Quick Prompt Pills Click Handler
        if (quickBar) {
            quickBar.addEventListener('click', function (e) {
                const pill = e.target.closest('.quick-pill');
                if (!pill) return;
                const prompt = pill.dataset.prompt;
                if (!prompt) return;
                input.value = prompt;
                input.focus();
            });
        }

        // 10. Prevent duplicate Enter submit
        input.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' && busy) event.preventDefault();
        });

        // Initialize chat
        loadSessions(true);
    })();
    </script>
</body>
</html>
